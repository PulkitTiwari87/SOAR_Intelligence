name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check soar ai tests migrations integrations
      - name: Tests (unit, integration, end-to-end scenarios)
        run: pytest
      - name: Static security scan (medium and above)
        run: bandit -q -r soar ai integrations cortex -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: No private keys in the tree
        run: "! git grep -nE 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY' -- . ':!*.md'"

  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  docker:
    name: Docker (config validation and image builds)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Throwaway values so the required-variable checks in the compose files can be evaluated.
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      WAZUH_INDEXER_ADMIN_PASSWORD: ci-only
      WAZUH_API_PASSWORD: ci-only
      THEHIVE_SECRET: ci-only
      MISP_DB_PASSWORD: ci-only
      MISP_ADMIN_PASSPHRASE: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.siem.yml config -q
      - name: Required secrets must fail fast
        run: "! env -u POSTGRES_PASSWORD docker compose config -q"
      - name: Build API image (trains the bundled models)
        run: docker build -t soar-api:ci .
      - name: Build UI image
        run: docker build -t soar-ui:ci dashboard/frontend
