<!-- 
  Wazuh Integration Configuration Block
  ======================================
  Add this block inside <ossec_config> in the Wazuh Manager's ossec.conf
  to enable automatic forwarding of high-severity alerts to TheHive.
  
  Location inside container: /var/ossec/etc/ossec.conf
  
  To apply:
    1. Copy wazuh_to_thehive.py to /var/ossec/integrations/ inside the container
    2. Add this block to ossec.conf
    3. Restart the Wazuh Manager
-->

<integration>
  <name>custom-thehive</name>
  <hook_url>http://thehive:9000</hook_url>
  <level>7</level>
  <alert_format>json</alert_format>
</integration>

<!-- Optional: Forward to a custom script for TheHive integration -->
<integration>
  <name>custom-wazuh_to_thehive.py</name>
  <hook_url>http://thehive:9000</hook_url>
  <level>7</level>
  <alert_format>json</alert_format>
  <group>authentication_failures,syscheck,suspicious_activity,malware_detection</group>
</integration>
