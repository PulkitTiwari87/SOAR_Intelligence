<!--
  Wazuh integration blocks for SOAR Intelligence
  ==============================================
  Add these blocks inside <ossec_config> in the Wazuh manager's /var/ossec/etc/ossec.conf, then
  restart the manager. Both forwarders run inside the manager container/host.

  1. SOAR Intelligence (primary): every alert at or above the level is normalized, correlated into
     incidents, scored and (per policy) responded to.
       - copy integrations/custom-soar to /var/ossec/integrations/custom-soar
         (chmod 750, chown root:wazuh)
       - <api_key> is the SOAR INGEST_API_KEY value from your .env (keep ossec.conf mode 640)
       - <hook_url> is the SOAR API base URL as reachable from the manager, e.g. http://soar-api:8000
         when both run in the same docker compose network
-->
<integration>
  <name>custom-soar</name>
  <hook_url>http://soar-api:8000</hook_url>
  <api_key>PUT_YOUR_INGEST_API_KEY_HERE</api_key>
  <level>7</level>
  <alert_format>json</alert_format>
</integration>

<!--
  2. TheHive (optional, independent of SOAR): forwards alerts straight to TheHive 5.
     Copy integrations/wazuh_to_thehive.py to /var/ossec/integrations/custom-thehive and export
     THEHIVE_URL / THEHIVE_API_KEY in the manager's environment (there is no built-in default key).
-->
<!--
<integration>
  <name>custom-thehive</name>
  <hook_url>http://thehive:9000</hook_url>
  <level>7</level>
  <alert_format>json</alert_format>
</integration>
-->
