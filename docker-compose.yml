# SOAR Project - Full Stack Docker Compose
# Wazuh 5.0.0 + TheHive 5 + Cortex 3 + MISP

services:
  # =============================================
  # WAZUH STACK (SIEM / EDR)
  # =============================================
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh.manager
    container_name: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - WAZUH_INDEXER_HOSTS=wazuh.indexer:9200
      - WAZUH_NODE_NAME=manager
      - WAZUH_CLUSTER_NODES=wazuh.manager
      - WAZUH_CLUSTER_BIND_ADDR=wazuh.manager
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/wazuh-manager/api/configuration
      - wazuh_etc:/var/wazuh-manager/etc
      - wazuh_logs:/var/wazuh-manager/logs
      - wazuh_queue:/var/wazuh-manager/queue
      - wazuh_var_multigroups:/var/wazuh-manager/var/multigroups
      - wazuh_active_response:/var/wazuh-manager/active-response/bin
      - ./wazuh-certificates/root-ca.pem:/var/wazuh-manager/etc/certs/root-ca.pem
      - ./wazuh-certificates/wazuh.manager.pem:/var/wazuh-manager/etc/certs/manager.pem
      - ./wazuh-certificates/wazuh.manager-key.pem:/var/wazuh-manager/etc/certs/manager-key.pem
    networks:
      - soar-network

  wazuh.indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    hostname: wazuh.indexer
    container_name: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - bootstrap.system_call_filter=false
      - network.host=wazuh.indexer
      - node.name=wazuh.indexer
      - cluster.initial_cluster_manager_nodes=wazuh.indexer
      - node.max_local_storage_nodes=1
      - plugins.security.allow_default_init_securityindex=true
      - NODES_DN=CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US
      - plugins.security.ssl.http.pemcert_filepath=/usr/share/wazuh-indexer/config/certs/indexer.pem
      - plugins.security.ssl.http.pemkey_filepath=/usr/share/wazuh-indexer/config/certs/indexer-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - plugins.security.ssl.transport.pemcert_filepath=/usr/share/wazuh-indexer/config/certs/indexer.pem
      - plugins.security.ssl.transport.pemkey_filepath=/usr/share/wazuh-indexer/config/certs/indexer-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=/usr/share/wazuh-indexer/config/certs/root-ca.pem
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - soar-network

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    hostname: wazuh.dashboard
    container_name: wazuh.dashboard
    restart: always
    ports:
      - "443:443"
    environment:
      - SERVER_PORT=5601
      - SERVER_HOST=0.0.0.0
      - OPENSEARCH_HOSTS=https://wazuh.indexer:9200
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/certs/dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/certs/dashboard-key.pem
      - OPENSEARCH_SSL_CERTIFICATE_AUTHORITIES=/usr/share/wazuh-dashboard/certs/root-ca.pem
    volumes:
      - ./wazuh-certificates/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/dashboard.pem
      - ./wazuh-certificates/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/dashboard-key.pem
      - ./wazuh-certificates/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-certificates/wazuh.dashboard.pem:/etc/wazuh-dashboard/certs/dashboard.pem
      - ./wazuh-certificates/wazuh.dashboard-key.pem:/etc/wazuh-dashboard/certs/dashboard-key.pem
      - ./wazuh-certificates/root-ca.pem:/etc/wazuh-dashboard/certs/root-ca.pem
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    networks:
      - soar-network

  # =============================================
  # ELASTICSEARCH (for TheHive + Cortex)
  # =============================================
  elasticsearch:
    image: elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soar-network

  # =============================================
  # CASSANDRA (database for TheHive)
  # =============================================
  cassandra:
    image: cassandra:4.0
    container_name: cassandra
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=1G
      - CASSANDRA_CLUSTER_NAME=TheHive
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soar-network

  # =============================================
  # CORTEX (Analysis & Response Engine)
  # =============================================
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: cortex
    depends_on:
      - elasticsearch
    environment:
      - "JAVA_OPTS=-Xms512m -Xmx512m"
      - search.index=cortex
      - search.uri=http://elasticsearch:9200
    ports:
      - "9001:9001"
    networks:
      - soar-network
    volumes:
      - ./cortex/responders:/opt/cortex/responders
      - ./cortex/analyzers:/opt/cortex/analyzers

  # =============================================
  # THEHIVE 5 (Case Management)
  # =============================================
  thehive:
    image: strangebee/thehive:5.4.1
    container_name: thehive
    depends_on:
      - cassandra
      - elasticsearch
      - cortex
    environment:
      - "JAVA_OPTS=-Xms1g -Xmx1g"
    command:
      - --secret
      - "th1s1s4v3rys3cr3tc0d3th4tsh0uldb3ch4ng3d"
      - --cql-hostnames
      - cassandra
      - --index-backend
      - elasticsearch
      - --es-hostnames
      - elasticsearch
      - --no-config-cortex
    ports:
      - "9000:9000"
    networks:
      - soar-network

  # =============================================
  # MARIADB (database for MISP)
  # =============================================
  misp-db:
    image: mariadb:10.4
    container_name: misp-db
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misp
      - MYSQL_ROOT_PASSWORD=misp_root
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - soar-network

  # =============================================
  # MISP (Threat Intelligence Platform)
  # =============================================
  misp-redis:
    image: redis:6
    container_name: misp-redis
    networks:
      - soar-network

  misp:
    image: coolacid/misp-docker:core-latest
    container_name: misp
    depends_on:
      - misp-db
      - misp-redis
    environment:
      - MYSQL_HOST=misp-db
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=misp
      - MISP_ADMIN_EMAIL=admin@admin.test
      - MISP_ADMIN_PASSPHRASE=admin
      - MISP_BASEURL=http://localhost:8080
      - CRON_USER_ID=1
      - REDIS_FQDN=misp-redis
    ports:
      - "8080:80"
    networks:
      - soar-network
    volumes:
      - ./wazuh-certificates/wazuh.dashboard.pem:/etc/nginx/certs/cert.pem:ro
      - ./wazuh-certificates/wazuh.dashboard-key.pem:/etc/nginx/certs/key.pem:ro

  # =============================================
  # SOAR DASHBOARD (MERN Stack)
  # =============================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - soar-network

  soar.backend:
    build:
      context: ./dashboard/backend
    container_name: soar.backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/soar_dashboard
      - JWT_SECRET=soar-dashboard-secret-key-2026
      - PORT=3000
      - WAZUH_INDEXER_URL=https://wazuh.indexer:9200
      - WAZUH_USER=admin
      - WAZUH_PASS=admin
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - wazuh.indexer
    networks:
      - soar-network

  soar.frontend:
    build:
      context: ./dashboard/frontend
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: soar.frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - soar.backend
    networks:
      - soar-network

networks:
  soar-network:
    driver: bridge

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_active_response:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  elasticsearch-data:
  cassandra-data:
  misp-db-data:
  mongodb-data:
  wazuh-certs-volume:
    external: true
