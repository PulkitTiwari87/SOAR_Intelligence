# SOAR Intelligence: local stack.
#
#   docker compose up -d --build                    core platform (API + UI + PostgreSQL)
#   docker compose -f docker-compose.yml -f docker-compose.siem.yml up -d --build
#                                                   + Wazuh / TheHive / Cortex / MISP (lab stack, ~10 GB RAM)
#
# Secrets come from .env (see .env.example). Nothing is hardcoded: required values fail fast.

name: soar

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  # ─────────────── core platform ───────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soar
      POSTGRES_DB: soar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - soar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soar -d soar"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [soar-net]

  soar-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SOAR_ENV: ${SOAR_ENV:-production}
      DATABASE_URL: postgresql://soar:${POSTGRES_PASSWORD}@postgres:5432/soar
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (>= 32 chars)}
      SOAR_DATA_DIR: /app/data
      SOAR_MODEL_DIR: /app/models
    ports:
      - "127.0.0.1:${SOAR_API_PORT:-8000}:8000"
    volumes:
      - soar-data:/app/data
      # Seeded from the models trained at image build; also where feedback retraining writes.
      - soar-models:/app/models
    read_only: true
    tmpfs: ["/tmp"]
    <<: *hardening
    networks: [soar-net]

  soar-ui:
    build: ./dashboard/frontend
    restart: unless-stopped
    depends_on:
      soar-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SOAR_UI_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp"]
    <<: *hardening
    networks: [soar-net]

networks:
  soar-net:
    driver: bridge

volumes:
  soar-pg:
  soar-data:
  soar-models:
